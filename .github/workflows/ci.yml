name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + dev tools
        run: pip install .[dev]

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  build:
    # PyInstaller artifact on version tags
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          pip install pyinstaller==6.21.0
          pyinstaller GFontConverter.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFontConverter-${{ github.ref_name }}
          path: dist/GFontConverter.exe
          if-no-files-found: error
